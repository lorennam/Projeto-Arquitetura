<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1090" width="1800" height="1090" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7e22ce"/></marker>
  </defs>
  <rect width="1800" height="1090" fill="#ffffff"/>
  <text x="900" y="55" text-anchor="middle" font-size="30" font-weight="bold" fill="#111827">Arquitetura do Sistema de Saúde: serviços, gateway e mensageria</text>

  <rect x="330" y="100" width="1430" height="850" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="350" y="128" font-size="15" fill="#6b7280" font-style="italic">health-network (rede interna do Docker)</text>

  <!-- Cliente -->
  <rect x="40" y="350" width="180" height="80" rx="12" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="130" y="385" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Cliente</text>
  <text x="130" y="408" text-anchor="middle" font-size="13" fill="#374151">paciente / médico / admin</text>

  <!-- Gateway -->
  <rect x="370" y="300" width="260" height="180" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="500" y="332" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">middleware (gateway)</text>
  <text x="500" y="354" text-anchor="middle" font-size="13" fill="#1e3a8a">:8000 (único exposto)</text>
  <text x="500" y="380" text-anchor="middle" font-size="13" fill="#1e3a8a">Correlation → JWT → RBAC</text>
  <text x="500" y="402" text-anchor="middle" font-size="13" fill="#1e3a8a">retry até 3x (backoff 0,5 s)</text>
  <text x="500" y="424" text-anchor="middle" font-size="13" fill="#1e3a8a">timeout 5 s (conexão 2 s)</text>
  <text x="500" y="446" text-anchor="middle" font-size="13" fill="#1e3a8a">circuit breaker: 3 falhas, 10 s</text>
  <text x="500" y="468" text-anchor="middle" font-size="12" fill="#1e3a8a">JWT emitido em /auth/login</text>

  <!-- Serviços -->
  <rect x="820" y="120" width="280" height="115" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="960" y="152" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">scheduling</text>
  <text x="960" y="175" text-anchor="middle" font-size="13" fill="#374151">:8001 · agendamento de consultas</text>
  <text x="960" y="197" text-anchor="middle" font-size="13" fill="#374151">publica evento + chama gRPC</text>
  <text x="960" y="219" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">dados em memória (não persiste)</text>

  <rect x="820" y="285" width="280" height="115" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="960" y="317" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">medical-record</text>
  <text x="960" y="340" text-anchor="middle" font-size="13" fill="#374151">:8002 REST · :50051 gRPC</text>
  <text x="960" y="362" text-anchor="middle" font-size="13" fill="#374151">acesso só do médico (RBAC)</text>
  <text x="960" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">dados em memória (não persiste)</text>

  <rect x="820" y="450" width="280" height="100" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="960" y="482" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">notification (API)</text>
  <text x="960" y="505" text-anchor="middle" font-size="13" fill="#374151">:8003 · /health e /metrics</text>

  <rect x="820" y="600" width="280" height="130" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="960" y="632" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">patient-extra-point</text>
  <text x="960" y="655" text-anchor="middle" font-size="13" fill="#374151">:8004 · cadastro de pacientes</text>
  <text x="960" y="676" text-anchor="middle" font-size="13" fill="#374151">CRUD /v1/pacientes · CPF único</text>
  <text x="960" y="698" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b21a8">dados em PostgreSQL</text>
  <text x="960" y="718" text-anchor="middle" font-size="12" fill="#6b7280">logs e métricas; sem tracing</text>

  <!-- Banco do patient-extra-point -->
  <rect x="1170" y="620" width="190" height="90" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2.5"/>
  <text x="1265" y="652" text-anchor="middle" font-size="18" font-weight="bold" fill="#581c87">patient-db</text>
  <text x="1265" y="675" text-anchor="middle" font-size="13" fill="#581c87">PostgreSQL</text>
  <text x="1265" y="696" text-anchor="middle" font-size="12" fill="#581c87">:5432 (rede interna)</text>

  <!-- RabbitMQ container -->
  <rect x="1220" y="110" width="530" height="320" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
  <text x="1240" y="135" font-size="15" font-weight="bold" fill="#14532d">RabbitMQ · vhost health · UI :15672 (só localhost)</text>

  <rect x="1270" y="150" width="200" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="1370" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">health.events</text>
  <text x="1370" y="200" text-anchor="middle" font-size="12" fill="#14532d">exchange topic</text>

  <rect x="1530" y="150" width="200" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="1630" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">notification.consultas</text>
  <text x="1630" y="200" text-anchor="middle" font-size="12" fill="#14532d">fila durável</text>

  <rect x="1250" y="330" width="210" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="1355" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">notification.consultas.retry</text>
  <text x="1355" y="377" text-anchor="middle" font-size="12" fill="#78350f">TTL 5 s, volta à exchange</text>

  <rect x="1500" y="330" width="190" height="70" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="1595" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">notification.consultas.dlq</text>
  <text x="1595" y="377" text-anchor="middle" font-size="12" fill="#7f1d1d">via health.dlx (falha final)</text>

  <!-- Consumer -->
  <rect x="1400" y="520" width="340" height="150" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
  <text x="1570" y="552" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">notification-consumer</text>
  <text x="1570" y="578" text-anchor="middle" font-size="13" fill="#374151">worker · ack manual · prefetch 1</text>
  <text x="1570" y="600" text-anchor="middle" font-size="13" fill="#374151">idempotência: SQLite em volume</text>
  <text x="1570" y="622" text-anchor="middle" font-size="13" fill="#374151">até 3 retries, depois DLQ</text>
  <text x="1570" y="644" text-anchor="middle" font-size="12" fill="#6b7280">sem métricas e sem tracing</text>

  <!-- Observabilidade -->
  <rect x="620" y="830" width="260" height="90" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="750" y="865" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Jaeger</text>
  <text x="750" y="889" text-anchor="middle" font-size="13" fill="#374151">traces · UI :16686</text>
  <rect x="920" y="830" width="230" height="90" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="1035" y="865" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Prometheus</text>
  <text x="1035" y="889" text-anchor="middle" font-size="13" fill="#374151">métricas · :9090</text>
  <rect x="1190" y="830" width="230" height="90" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="1305" y="865" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Grafana</text>
  <text x="1305" y="889" text-anchor="middle" font-size="13" fill="#374151">dashboards · :3000</text>

  <!-- HTTP -->
  <line x1="220" y1="390" x2="368" y2="390" stroke="#1d4ed8" stroke-width="3" marker-end="url(#aBlue)"/>
  <text x="294" y="378" text-anchor="middle" font-size="13" fill="#1d4ed8">HTTP + JWT</text>
  <path d="M630,390 H725 V177 H818" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#aBlue)"/>
  <path d="M630,390 H725 V342 H818" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#aBlue)"/>
  <path d="M630,390 H725 V500 H818" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#aBlue)"/>
  <path d="M630,390 H725 V665 H818" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#aBlue)"/>
  <text x="640" y="356" font-size="12" fill="#1d4ed8">/api/{serviço}</text>
  <text x="640" y="373" font-size="12" fill="#1d4ed8">HTTP síncrono</text>

  <!-- gRPC -->
  <line x1="960" y1="235" x2="960" y2="283" stroke="#c2410c" stroke-width="3" marker-end="url(#aOrange)"/>
  <text x="975" y="256" font-size="13" fill="#c2410c" font-weight="bold">gRPC (síncrono)</text>
  <text x="975" y="274" font-size="13" fill="#c2410c">ExisteProntuario</text>

  <!-- SQL -->
  <line x1="1100" y1="665" x2="1168" y2="665" stroke="#7e22ce" stroke-width="3" marker-end="url(#aPurple)"/>
  <text x="1134" y="652" text-anchor="middle" font-size="11" fill="#7e22ce" font-weight="bold">SQL</text>

  <!-- Async -->
  <line x1="1100" y1="185" x2="1268" y2="185" stroke="#15803d" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#aGreen)"/>
  <text x="1160" y="165" text-anchor="middle" font-size="11" fill="#15803d" font-weight="bold">consulta.agendada</text>
  <text x="1160" y="210" text-anchor="middle" font-size="11" fill="#15803d">publica</text>
  <line x1="1470" y1="185" x2="1528" y2="185" stroke="#15803d" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#aGreen)"/>
  <text x="1499" y="173" text-anchor="middle" font-size="11" fill="#15803d">binding</text>

  <line x1="1720" y1="220" x2="1720" y2="518" stroke="#15803d" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#aGreen)"/>
  <text x="1708" y="262" text-anchor="end" font-size="12" fill="#15803d" font-weight="bold">consome</text>
  <text x="1708" y="279" text-anchor="end" font-size="12" fill="#15803d">(ack manual)</text>

  <!-- Falha / retry / DLQ -->
  <line x1="1420" y1="520" x2="1420" y2="402" stroke="#b91c1c" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#aRed)"/>
  <text x="1410" y="470" text-anchor="end" font-size="12" fill="#b91c1c" font-weight="bold">erro: retry</text>
  <text x="1410" y="487" text-anchor="end" font-size="12" fill="#b91c1c">(até 3 vezes)</text>
  <line x1="1600" y1="520" x2="1600" y2="402" stroke="#b91c1c" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#aRed)"/>
  <text x="1610" y="470" font-size="12" fill="#b91c1c" font-weight="bold">esgotou</text>
  <text x="1610" y="487" font-size="12" fill="#b91c1c">→ DLQ</text>
  <path d="M1250,365 H1235 V185 H1268" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#aGreen)"/>

  <!-- Telemetria -->
  <line x1="960" y1="730" x2="960" y2="785" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="3 5"/>
  <line x1="750" y1="785" x2="1035" y2="785" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="3 5"/>
  <line x1="750" y1="785" x2="750" y2="828" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="3 5" marker-end="url(#aGray)"/>
  <line x1="1035" y1="785" x2="1035" y2="828" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="3 5" marker-end="url(#aGray)"/>
  <line x1="1150" y1="875" x2="1188" y2="875" stroke="#6b7280" stroke-width="2.5" marker-end="url(#aGray)"/>
  <text x="975" y="754" font-size="12" fill="#6b7280">traces (OTLP :4318): middleware, scheduling, medical-record</text>
  <text x="975" y="772" font-size="12" fill="#6b7280">métricas: scrape de /metrics dos serviços (Prometheus)</text>

  <!-- Legenda -->
  <rect x="40" y="980" width="1720" height="70" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="60" y="1022" font-size="15" font-weight="bold" fill="#111827">Legenda</text>
  <line x1="160" y1="1016" x2="215" y2="1016" stroke="#1d4ed8" stroke-width="3" marker-end="url(#aBlue)"/>
  <text x="225" y="1021" font-size="14" fill="#374151">HTTP síncrono</text>
  <line x1="380" y1="1016" x2="435" y2="1016" stroke="#c2410c" stroke-width="3" marker-end="url(#aOrange)"/>
  <text x="445" y="1021" font-size="14" fill="#374151">gRPC síncrono (interno)</text>
  <line x1="660" y1="1016" x2="715" y2="1016" stroke="#15803d" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#aGreen)"/>
  <text x="725" y="1021" font-size="14" fill="#374151">assíncrono (RabbitMQ)</text>
  <line x1="940" y1="1016" x2="995" y2="1016" stroke="#b91c1c" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#aRed)"/>
  <text x="1005" y="1021" font-size="14" fill="#374151">falha: retry e DLQ</text>
  <line x1="1200" y1="1016" x2="1255" y2="1016" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="3 5" marker-end="url(#aGray)"/>
  <text x="1265" y="1021" font-size="14" fill="#374151">telemetria (traces e métricas)</text>
  <line x1="1520" y1="1016" x2="1575" y2="1016" stroke="#7e22ce" stroke-width="3" marker-end="url(#aPurple)"/>
  <text x="1585" y="1021" font-size="14" fill="#374151">SQL (PostgreSQL)</text>
</svg>

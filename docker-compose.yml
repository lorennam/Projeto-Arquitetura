
services:
  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    image: health-middleware
    ports:
      - "8000:8000"
    networks:
      - health-network
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_EXPIRES_MINUTES=${JWT_EXPIRES_MINUTES}
      - PATIENT_PASSWORD=${PATIENT_PASSWORD}
      - DOCTOR_PASSWORD=${DOCTOR_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SCHEDULING_URL=${SCHEDULING_URL}
      - MEDICAL_RECORD_URL=${MEDICAL_RECORD_URL}
      - NOTIFICATION_URL=${NOTIFICATION_URL}
      - PATIENT_EXTRA_POINT_URL=${PATIENT_EXTRA_POINT_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      - jaeger
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  scheduling:
    build:
      context: .
      dockerfile: services/scheduling/Dockerfile
    image: health-scheduling
    networks:
      - health-network
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  medical-record:
    build:
      context: .
      dockerfile: services/medical-record/Dockerfile
    image: health-medical-record
    networks:
      - health-network
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  notification:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    image: health-notification
    networks:
      - health-network
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  notification-consumer:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    image: health-notification
    command: ["python", "consumer.py"]
    networks:
      - health-network
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
      - IDEMPOTENCY_DB_PATH=/data/processed_messages.db
    volumes:
      - notification_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  patient-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PATIENT_DB_USER:-patient_user}
      POSTGRES_PASSWORD: ${PATIENT_DB_PASSWORD:-patient_dev_password}
      POSTGRES_DB: ${PATIENT_DB_NAME:-patients}
    volumes:
      - patient_data:/var/lib/postgresql/data
    networks:
      - health-network
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${PATIENT_DB_USER:-patient_user}",
          "-d",
          "${PATIENT_DB_NAME:-patients}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  patient-extra-point:
    build:
      context: ./services/patient_extra_point
      dockerfile: Dockerfile
    image: health-patient-extra-point
    networks:
      - health-network
    environment:
      - DATABASE_URL=postgresql+psycopg://${PATIENT_DB_USER:-patient_user}:${PATIENT_DB_PASSWORD:-patient_dev_password}@patient-db:5432/${PATIENT_DB_NAME:-patients}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      patient-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy




  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - health-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - health-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - health-network
    depends_on:
      rabbitmq:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - health-network
    depends_on:
      - prometheus

networks:
  health-network:
    driver: bridge

volumes:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  notification_data:
  patient_data:
